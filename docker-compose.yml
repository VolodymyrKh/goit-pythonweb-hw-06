# Локальна БД для цього проєкту.
# Значення підставляються з .env — того самого, що читає Python.
#   docker compose up -d --wait   запустити й дочекатися готовності
#   docker compose down           зупинити (дані лишаються у volume)
#   docker compose down -v        зупинити й видалити дані

name: hw06

services:
  postgres:
    image: postgres:16
    container_name: hw06-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
